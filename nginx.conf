server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api vers le backend Render
    location /api/ {
        proxy_pass https://kiiraay-backend.onrender.com/api/;
        proxy_set_header Host kiiraay-backend.onrender.com;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_ssl_server_name on;
    }

    # Service worker et manifeste sans cache
    location ~ ^/(ngsw-worker\.js|ngsw\.json|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Routage Angular SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
