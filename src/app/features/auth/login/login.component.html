<div class="page-connexion">
  <!-- Volet gauche : photo officielle en arriere-plan + slogan du parti -->
  <div class="volet-visuel">
    <div class="voile"></div>
    <img class="emblume" src="assets/images/emblem-kiiraay.png" alt="" />
    <div class="contenu-visuel">
      <p class="sur-titre">Les Patriotes Republicains</p>
      <p class="slogan">KIIRAAY</p>
      <p class="sous-slogan">« Diomaye Moom Sa Ndam »</p>
    </div>
  </div>

  <!-- Volet droit : formulaire de connexion -->
  <div class="volet-formulaire">
    <form class="carte-connexion" [formGroup]="formulaire" (ngSubmit)="soumettre()">
      <h1>KIIRAAY</h1>
      <p class="sous-titre">Base de donnees departementale</p>

      <label for="login">Identifiant</label>
      <input id="login" type="text" formControlName="login" autocomplete="username" />

      <label for="motDePasse">Mot de passe</label>
      <div class="champ-mdp">
        <input
          id="motDePasse"
          [type]="motDePasseVisible() ? 'text' : 'password'"
          formControlName="motDePasse"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="bouton-oeil"
          (click)="basculerVisibiliteMotDePasse()"
          [attr.aria-label]="motDePasseVisible() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
        >
          @if (motDePasseVisible()) {
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="21" x2="21" y2="3"/></svg>
          } @else {
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          }
        </button>
      </div>

      @if (messageErreur()) {
        <p class="erreur">{{ messageErreur() }}</p>
      }

      <button type="submit" [disabled]="enCours()">
        {{ enCours() ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>
  </div>
</div>
