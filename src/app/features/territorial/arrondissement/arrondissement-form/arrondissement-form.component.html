<div class="page">
  <h1>{{ modeEdition ? 'Modifier l\'arrondissement' : 'Nouvel arrondissement' }}</h1>

  @if (messageErreur()) {
    <p class="message-erreur">{{ messageErreur() }}</p>
  }

  <form [formGroup]="formulaire" (ngSubmit)="enregistrer()" class="formulaire">
    <label for="nom">Nom</label>
    <input id="nom" type="text" formControlName="nom" placeholder="Ex : Arrondissement de Dagana" />

    <label for="code">Code</label>
    <input id="code" type="text" formControlName="code" placeholder="Ex : DAGANA-ARR-01" />

    <label for="departementId">Departement</label>
    <select id="departementId" formControlName="departementId">
      <option [ngValue]="null" disabled>Choisir un departement</option>
      @for (departement of departements(); track departement.id) {
        <option [ngValue]="departement.id">{{ departement.nom }}</option>
      }
    </select>

    <div class="boutons">
      <button type="button" class="bouton-secondaire" (click)="annuler()">Annuler</button>
      <button type="submit" class="bouton-primaire" [disabled]="enCours()">
        {{ enCours() ? 'Enregistrement...' : 'Enregistrer' }}
      </button>
    </div>
  </form>
</div>
