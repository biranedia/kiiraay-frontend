<div class="page">
  <h1>{{ modeEdition ? 'Modifier la commune / ville' : 'Nouvelle commune / ville' }}</h1>

  @if (messageErreur()) {
    <p class="message-erreur">{{ messageErreur() }}</p>
  }

  <form [formGroup]="formulaire" (ngSubmit)="enregistrer()" class="formulaire">
    <label for="nom">Nom</label>
    <input id="nom" type="text" formControlName="nom" placeholder="Ex : Richard-Toll" />

    <label for="type">Type</label>
    <select id="type" formControlName="type">
      <option value="COMMUNE">Commune</option>
      <option value="VILLE">Ville</option>
    </select>

    <label for="code">Code</label>
    <input id="code" type="text" formControlName="code" placeholder="Ex : DAGANA-COM-02" />

    <label for="arrondissementId">Arrondissement</label>
    <select id="arrondissementId" formControlName="arrondissementId">
      <option [ngValue]="null" disabled>Choisir un arrondissement</option>
      @for (item of arrondissements(); track item.id) {
        <option [ngValue]="item.id">{{ item.nom }}</option>
      }
    </select>

    <div class="boutons">
      <button type="button" class="bouton-secondaire" (click)="annuler()">Annuler</button>
      <button type="submit" class="bouton-primaire" [disabled]="enCours()">
        {{ enCours() ? 'Enregistrement...' : 'Enregistrer' }}
      </button>
    </div>
  </form>
</div>
