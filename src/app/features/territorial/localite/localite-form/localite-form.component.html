<div class="page">
  <h1>{{ modeEdition ? 'Modifier la localite' : 'Nouvelle localite' }}</h1>

  @if (messageErreur()) {
    <p class="message-erreur">{{ messageErreur() }}</p>
  }

  <form [formGroup]="formulaire" (ngSubmit)="enregistrer()" class="formulaire">
    <label for="nom">Nom</label>
    <input id="nom" type="text" formControlName="nom" placeholder="Ex : Ngambe" />

    <label for="type">Type de localite</label>
    <select id="type" formControlName="type">
      <option value="QUARTIER">Quartier</option>
      <option value="VILLAGE">Village</option>
      <option value="HAMEAU">Hameau</option>
    </select>

    <label for="latitude">Latitude (optionnel)</label>
    <input id="latitude" type="number" step="any" formControlName="latitude" placeholder="Ex : 16.5167" />

    <label for="longitude">Longitude (optionnel)</label>
    <input id="longitude" type="number" step="any" formControlName="longitude" placeholder="Ex : -15.5" />

    <label for="communeVilleId">Commune / Ville</label>
    <select id="communeVilleId" formControlName="communeVilleId">
      <option [ngValue]="null" disabled>Choisir une commune/ville</option>
      @for (item of communesVilles(); track item.id) {
        <option [ngValue]="item.id">{{ item.nom }}</option>
      }
    </select>

    <div class="boutons">
      <button type="button" class="bouton-secondaire" (click)="annuler()">Annuler</button>
      <button type="submit" class="bouton-primaire" [disabled]="enCours()">
        {{ enCours() ? 'Enregistrement...' : 'Enregistrer' }}
      </button>
    </div>
  </form>
</div>
